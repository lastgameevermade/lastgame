[workspace]
resolver = "3"
members = ["api", "game", "engine", "checker"]

# Zero external dependencies, on purpose. Nothing to vendor, nothing to hijack.
# Adding one needs core team sign-off (see CONSTITUTION.md).

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
