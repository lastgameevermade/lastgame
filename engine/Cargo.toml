[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The wasm the browser runs: fixed-step loop plus a flat data view for the renderer. Imports nothing."

[lib]
crate-type = ["cdylib"]

[features]
