# UNTRUSTED: this runs pull request code. It has no secrets and a read-only
# token, and everything after the image build runs with networking off.
# Its verdict is only an artifact. The trusted `verdict` workflow decides what
# to believe (it re-checks the changed paths from GitHub's API) and posts it.
#
# Never switch this to `pull_request_target`.
name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Merge the pull request into today's main (plain git, no credentials stored)
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q src
          cd src
          # The read-only token is passed for this one command and never written to
          # .git/config, so nothing that runs later can find it.
          # GitHub's own test merge (refs/pull/N/merge) stays on the main it was made on, so a
          # run started again after main moved would judge the old main. We merge here instead.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --no-tags "https://github.com/$REPO" "+refs/heads/$BASE:refs/remotes/main" "+refs/pull/$PR/head:refs/remotes/pr"
          git checkout -q --detach refs/remotes/main
          git rev-parse HEAD > ../base.sha   # the main commit this check runs on top of
          if git -c user.name=check -c user.email=check@invalid merge -q --no-ff --no-edit refs/remotes/pr; then
            git diff --name-status --no-renames refs/remotes/main HEAD > ../changed.txt
          else
            git merge --abort
            : > ../changed.txt
            echo "conflict=yes" >> "$GITHUB_ENV"
          fi
          cat ../changed.txt
          # main as it is now, for the ratchet
          git worktree add -q --detach ../base refs/remotes/main

      - name: Build the sandbox image
        if: env.conflict != 'yes'
        run: docker build -q -t lastgame-build src

      - name: Checker (networking off)
        if: env.conflict != 'yes'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOC: ${{ github.event.pull_request.author_association }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          cp changed.txt src/changed.txt
          # Core team pull requests may touch core paths. Who is core comes from main
          # (the base tree), and the trusted verdict workflow checks it again.
          # Only while main has no list yet, GitHub's own association decides.
          args="--changed changed.txt"
          if [ -f base/.github/core-team ]; then
            if grep -v '^#' base/.github/core-team | grep -qix -- "$AUTHOR"; then args=""; fi
          else
            case "$ASSOC" in OWNER|MEMBER) args="" ;; esac
          fi
          # With a desk lease it is a swarm change, whoever opens it: the swarm's rules apply.
          if [ "$(jq -rn --arg b "$BODY" '$b | test("Lease:\\s*[0-9a-f]{12}")')" = true ]; then args="--changed changed.txt"; fi
          echo "core=$([ -z "$args" ] && echo yes || echo no)" >> "$GITHUB_ENV"
          docker run --rm --network none -v "$PWD/src:/src" -v "$PWD/base:/base" lastgame-build sh -c \
            "cargo build -q --release --locked --offline -p checker && target/release/checker --base /base --out verdict.json $args" || true
          if [ ! -s src/verdict.json ]; then
            echo '{"verdict":"FAULT","stage":"runner","reasons":["the checker produced no verdict"],"metrics":{}}' > src/verdict.json
          fi

      - name: Core checks (unit tests, attack suite, desk tests)
        if: env.core == 'yes'
        run: |
          if ! docker run --rm --network none -v "$PWD/src:/src" lastgame-build sh -c \
               "cargo test -q --offline --locked -p api -p checker && sh checker/suite/run.sh" \
             || ! docker run --rm --network none -v "$PWD/src:/src" -w /src \
               node@sha256:873f586f3794f52281bd039bf02c048a0be08fde619338f9941bad1eb6b34530 node --no-warnings desk/test.mjs; then
            jq -c '.verdict = "REJECTED" | .stage = "suite" | .reasons += ["unit tests or the attack suite failed, see the run log"]' \
              src/verdict.json > v.json && mv v.json src/verdict.json
          fi

      - name: Package the verdict
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${conflict:-}" = yes ]; then
            echo '{"verdict":"REJECTED","stage":"merge","reasons":["it does not merge cleanly with main: update the branch"],"metrics":{}}' > src/verdict.json
          fi
          jq -c --argjson pr "$PR" --arg base "$(cat base.sha)" '. + {pr: $pr, base: $base}' src/verdict.json > verdict.json
          cat verdict.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: verdict.json
          retention-days: 7

      # Before and after pictures from the checker, for reviewers. Untrusted like the verdict.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: src/shots/
          retention-days: 7
          if-no-files-found: ignore
