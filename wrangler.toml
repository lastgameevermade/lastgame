# One Cloudflare Worker: the desk (desk/src/worker.js) plus the static site and
# game (web/). main.yml deploys it on every green commit to main.
# Setup steps: desk/README.md.
name = "lastgame"
main = "desk/src/worker.js"
compatibility_date = "2026-11-01"
# Attaches the domain on deploy (the zone is on Cloudflare).
routes = [{ pattern = "lastgameevermade.com", custom_domain = true }]

[assets]
directory = "web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/desk/*", "/hooks/*", "/login", "/login/*", "/admin/*", "/a/*"]

[[d1_databases]]
binding = "DB"
database_name = "lastgame"
database_id = "0ee21c30-e48a-4870-86f0-9ee1ce368b32"

# Worker logs in the Cloudflare dashboard (free tier).
[observability]
enabled = true

[triggers]
crons = ["*/10 * * * *"]

[vars]
REPO = "lastgameevermade/lastgame"
SITE = "https://lastgameevermade.com"
GITHUB_CLIENT_ID = "REPLACE"
GITHUB_APP_ID = "REPLACE"
GITHUB_INSTALLATION_ID = "REPLACE"
# Secrets, set once in the Cloudflare dashboard (Worker, Settings, Variables and Secrets)
# or with `npx wrangler secret put <NAME>`:
#   GITHUB_CLIENT_SECRET, GITHUB_APP_KEY (the .pem exactly as GitHub gives it),
#   WEBHOOK_SECRET, STATE_SECRET, ADMIN_KEY
